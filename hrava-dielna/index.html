<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hravá dielňa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style id="app-css">
/* Layout: workshop shelf — type tiles on top, teacher's library below; editor = form left, live child view right. */
:root{
  --bg:#EDF2F9; --surface:#FFFFFF; --surface-2:#F5F8FC; --ink:#1B2440; --muted:#5A6582; --line:#D5DDEA;
  --accent:#2D6BE4; --accent-ink:#FFFFFF; --ok:#14874A; --ok-bg:#DCF4E6; --bad:#C9372F; --bad-bg:#FCE2DF;
  --sun:#F2B705; --secret:#FFE7A0;
  --font-display:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgb(27 36 64 / .06),0 6px 18px rgb(27 36 64 / .07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A; --surface:#19213A; --surface-2:#202A46; --ink:#E9EDF7; --muted:#A3ADC7; --line:#2F3B5C;
  --accent:#729DFF; --accent-ink:#0D1325; --ok:#46D08B; --ok-bg:#16392A; --bad:#FF7B70; --bad-bg:#45211F;
  --sun:#FFCB3D; --secret:#4D3F12; --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#19213A; --surface-2:#202A46; --ink:#E9EDF7; --muted:#A3ADC7; --line:#2F3B5C;
  --accent:#729DFF; --accent-ink:#0D1325; --ok:#46D08B; --ok-bg:#16392A; --bad:#FF7B70; --bad-bg:#45211F;
  --sun:#FFCB3D; --secret:#4D3F12; --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:800}
p{margin:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto}
.muted{color:var(--muted)}

/* buttons */
.btn{font:800 .95rem/1.2 var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px;text-decoration:none;transition:border-color .15s,background .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.88rem;border-radius:10px}
.btn.big{font-size:1.1em;padding:.7em 1.4em;border-radius:14px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{flex:none;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:900;font-size:.85rem;display:inline-grid;place-items:center;padding:0}
.icon-btn:hover:not(:disabled){border-color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;max-width:1200px;margin:0 auto;border-bottom:1.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:left}
.brand-name{font:800 1.4rem/1 var(--font-display)}
.brand-sub{display:block;font:700 .78rem/1.3 var(--font-body);color:var(--muted)}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}

/* home */
.intro{padding-block:28px 18px;display:flex;flex-direction:column;gap:8px;max-width:60ch}
.intro h1{font-size:clamp(1.9rem,1.4rem + 2vw,2.7rem)}
.lead{font-size:1.08rem;color:var(--muted)}
.sec-h{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.count{font:800 .85rem var(--font-body);background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
.home section{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:12px}
.type-tile{text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:start;padding:14px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;color:inherit;font:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
.type-tile:hover{border-color:var(--tc);transform:translateY(-2px);box-shadow:var(--shadow)}
.type-ico{grid-row:span 3;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:27px;background:color-mix(in srgb,var(--tc) 18%,var(--surface))}
.type-tile strong{font:800 1.12rem/1.2 var(--font-display)}
.type-tile .desc{font-size:.88rem;color:var(--muted);line-height:1.35}
.age{justify-self:start;font-size:.72rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--tc);margin-top:4px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-top{display:flex;align-items:center;gap:10px}
.card-top .type-ico{width:40px;height:40px;font-size:21px;border-radius:12px;grid-row:auto}
.type-name{font-size:.8rem;font-weight:900;color:var(--tc);text-transform:uppercase;letter-spacing:.05em}
.tag{font-size:.72rem;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-left:6px}
.card-title{font-size:1.2rem;overflow-wrap:anywhere}
.card-sub{font-size:.86rem;color:var(--muted)}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px;align-items:center}
.more{position:relative}
.more>summary{list-style:none;cursor:pointer}
.more>summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:230px}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:9px;font:700 .92rem var(--font-body);color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu .danger{color:var(--bad)}
.empty-lib{padding:24px;border:2px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;counter-reset:st;list-style:none;padding:0;margin:0}
.steps li{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;counter-increment:st}
.steps li::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 1rem var(--font-display);margin-bottom:4px}
.steps strong{font-family:var(--font-display);font-size:1.05rem}
.steps span{color:var(--muted);font-size:.92rem}
.note{font-size:.9rem;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}

/* editor */
.ed-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:16px}
.ed-type{display:flex;align-items:center;gap:10px}
.ed-type .type-ico{width:40px;height:40px;font-size:21px;border-radius:12px}
.ed-type h1{font-size:1.4rem}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap}
.ed-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.ed-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}
  .ed-preview{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.ed-form{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-block{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ed-h{font-size:1.15rem}
.prev-label{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.saved{font-weight:700}
.saved.warn{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-weight:800;font-size:.9rem}
.lbl small{font-weight:600;color:var(--muted);font-size:.84rem}
.inp{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;line-height:1.55}
select.inp{cursor:pointer}
.upper{text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.list{display:flex;flex-direction:column;gap:12px}
.row-card{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);min-width:0}
.row-card .inp{background:var(--surface)}
.row-tools,.row-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-num{font-weight:900;margin-right:auto;font-size:.92rem}
.row-head strong{margin-right:auto}
.add{align-self:flex-start;border-style:dashed}
.pic-field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pic-field .inp{flex:1 1 130px}
.thumb{width:50px;height:50px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;overflow:hidden;background:var(--surface);flex:none}
.thumb .ct-emoji{font-size:28px}
.thumb .ct-word{font-size:.68rem;font-weight:800;text-align:center;padding:2px;overflow-wrap:anywhere;line-height:1.1}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-empty{color:var(--muted)}
.answers{display:flex;flex-direction:column;gap:8px}
.ans-row{display:flex;gap:6px;align-items:center}
.ans-row .inp{flex:1}
.okmark{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ok);font-weight:900;cursor:pointer;padding:0}
.okmark.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.chip-bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.letter-badge{width:32px;height:32px;border-radius:8px;background:var(--secret);display:grid;place-items:center;font:800 1.1rem var(--font-display)}
.switch{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--surface);color:var(--ink);font:800 .9rem var(--font-body);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.hint{color:var(--muted);font-size:.9rem}
.hint code{font-weight:800;color:var(--ink);background:var(--surface-2);padding:0 4px;border-radius:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.emoji-pop{position:absolute;z-index:60;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:2px;max-height:270px;overflow:auto}
.emo{font-size:22px;background:none;border:0;border-radius:8px;cursor:pointer;height:38px;padding:0}
.emo:hover{background:var(--surface-2)}

/* player */
.player{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:1.1em;display:flex;flex-direction:column;gap:1em;font-size:1rem;min-width:0}
.player.big{font-size:clamp(1rem,.78rem + .9vw,1.42rem);max-width:1100px;margin:0 auto}
.p-head{display:flex;gap:.8em;align-items:center}
.p-badge{width:2.5em;height:2.5em;border-radius:.75em;display:grid;place-items:center;font-size:1.25em;background:color-mix(in srgb,var(--tc) 18%,var(--surface));flex:none}
.p-titles{flex:1;min-width:0}
.p-title{font-size:1.45em;overflow-wrap:anywhere}
.p-instr{color:var(--muted);margin-top:.1em}
.speak{flex:none;width:2.3em;height:2.3em;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:1em;padding:0;display:inline-grid;place-items:center}
.speak:hover{border-color:var(--tc)}
.p-body{display:flex;flex-direction:column;gap:1em;min-width:0}
.p-prog{display:flex;align-items:center;gap:.35em;flex-wrap:wrap}
.dot{width:.7em;height:.7em;border-radius:50%;background:var(--line)}
.dot.done{background:var(--tc)}
.dot.now{background:var(--tc);box-shadow:0 0 0 .22em color-mix(in srgb,var(--tc) 30%,transparent)}
.p-prog .num{margin-left:auto;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.q-card{display:flex;flex-direction:column;align-items:center;gap:.6em;text-align:center;padding:.3em}
.ct-emoji{line-height:1.1}
.ct-word{overflow-wrap:anywhere}
.q-pic.ct-emoji{font-size:4.2em}
.q-pic.ct-img{max-height:9em;border-radius:.6em}
.q-pic.ct-word{font:800 2em var(--font-display)}
.q-line{display:flex;gap:.6em;align-items:center;justify-content:center}
.q-text{font:800 1.4em/1.25 var(--font-display)}
.ans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12em),1fr));gap:.7em}
.ans-grid.pics{grid-template-columns:repeat(auto-fit,minmax(5.5em,1fr))}
.ans,.match{font:800 1.2em/1.2 var(--font-display);color:var(--ink);min-height:3.1em;padding:.45em .8em;border-radius:.8em;border:2px solid var(--line);background:var(--surface-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4em;text-align:center;transition:border-color .15s,background .15s}
.ans .ct-emoji,.match .ct-emoji{font-size:1.9em}
.ans .ct-img,.match .ct-img{max-height:5em;border-radius:.4em}
.ans:hover:not(:disabled),.match:hover:not(.done){border-color:var(--tc)}
.ans:disabled{cursor:default}
.ans.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);animation:pop .3s}
.ans.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.ans.reveal{border-color:var(--ok);border-style:dashed}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.tf-row .ans{font-size:1.35em;min-height:3.4em}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.p-actions{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap}
.p-status{text-align:center;font-weight:800;min-height:1.5em}
.p-status.good{color:var(--ok)}
.p-status.badtxt{color:var(--bad)}
.p-empty{color:var(--muted);text-align:center;padding:2em 1em}
.p-hint{color:var(--muted);text-align:center;font-size:.92em}
.p-end{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6em;padding:1.4em .5em}
.stars{font-size:3em;display:flex;gap:.15em;line-height:1}
.star{color:var(--line)}
.star.on{color:var(--sun);animation:pop .45s backwards}
.star.on:nth-child(2){animation-delay:.15s}.star.on:nth-child(3){animation-delay:.3s}
.p-end h3{font-size:1.8em}
.p-score{font-weight:800;font-size:1.1em}

/* tajnička */
.tj-wrap{overflow-x:auto;padding:4px}
.tj-grid{display:grid;gap:3px;width:max-content;margin:0 auto;font-size:1.1em}
.tj-num{display:grid;place-items:center;font-weight:900;color:var(--muted);font-size:.85em}
.tj-cell{width:2.1em;height:2.1em;text-align:center;font:800 1em var(--font-display);text-transform:uppercase;border:2px solid color-mix(in srgb,var(--ink) 55%,var(--line));border-radius:6px;background:var(--surface);color:var(--ink);padding:0;caret-color:var(--tc)}
.tj-cell.secret{background:var(--secret);border-color:color-mix(in srgb,var(--sun) 65%,var(--ink))}
.tj-cell.ok{background:var(--ok-bg);border-color:var(--ok)}
.tj-cell.bad{background:var(--bad-bg);border-color:var(--bad)}
.tj-clues{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.4em}
.tj-clues li{display:flex;align-items:center;gap:.6em;padding:.4em .6em;border-radius:.6em;background:var(--surface-2)}
.tj-cn{font-weight:900;min-width:1.6em}
.tj-pic.ct-emoji{font-size:1.6em}
.tj-pic.ct-img{height:2.4em;border-radius:.3em}
.tj-pic.ct-word{font-weight:800}
.tj-ct{flex:1;min-width:0}
.tj-len{font-size:.8em;color:var(--muted);white-space:nowrap}
.speak.sm{width:1.9em;height:1.9em;font-size:.85em}

/* pexeso */
.pex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6em,1fr));gap:.6em}
.pex{aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;perspective:700px;max-width:100%;font:inherit;color:inherit}
.pex-inner{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.pex.open .pex-inner,.pex.done .pex-inner{transform:rotateY(180deg)}
.pex-back,.pex-front{position:absolute;inset:0;border-radius:.8em;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.pex-back{background:var(--tc);color:#fff;font:800 2em var(--font-display);
  background-image:radial-gradient(circle at 25% 25%,rgb(255 255 255 / .22) 0 12%,transparent 13%),radial-gradient(circle at 75% 75%,rgb(255 255 255 / .22) 0 12%,transparent 13%)}
.pex-front{background:var(--surface);border:2px solid var(--line);transform:rotateY(180deg);padding:.3em}
.pex.done .pex-front{border-color:var(--ok);background:var(--ok-bg)}
.pex-front .ct-emoji{font-size:2.5em}
.pex-front .ct-word{font:800 1.05em/1.1 var(--font-display);text-align:center}
.pex-front .ct-img{max-width:100%;max-height:100%;object-fit:contain}

/* priraďovanie */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:1em 2em}
.match-col{display:flex;flex-direction:column;gap:.6em;min-width:0}
.match{position:relative}
.match.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 30%,transparent)}
.match.done{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 18%,var(--surface));cursor:default}
.mbadge{position:absolute;top:-.55em;right:-.55em;width:1.7em;height:1.7em;border-radius:50%;background:var(--mc);color:#fff;font:800 .75rem var(--font-display);display:grid;place-items:center}

/* doplňovačka */
.gap-text{font-size:1.2em;line-height:2.3;white-space:pre-wrap;overflow-wrap:anywhere}
.gap-slot,.gap-inp{font:inherit;font-weight:900;line-height:1.5;color:var(--ink);border:0;border-bottom:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface));border-radius:.35em .35em 0 0;padding:0 .45em;text-align:center}
.gap-slot{min-width:3em;cursor:pointer}
